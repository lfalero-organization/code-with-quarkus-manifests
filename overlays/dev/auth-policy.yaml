apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: code-with-quarkus
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: code-with-quarkus
  defaults:
    strategy: merge
    patterns:
      "pattern-reader":
        allOf:
          - selector: auth.identity.realm_access.roles
            operator: incl
            value: api-reader

      "pattern-admin":
        allOf:
          - selector: auth.identity.realm_access.roles
            operator: incl
            value: api-admin

    rules:
      authentication:
        "health-anonymous":
          when:
            - predicate: >
                (request.method == 'GET' && request.path == '/q/health') ||
                (request.method == 'GET' && request.path == '/lfalero/q/health')
          anonymous: {}

      authorization:
        "route-authz":
          when:
            - predicate: >
                !(
                  (request.method == 'GET' && request.path == '/q/health') ||
                  (request.method == 'GET' && request.path == '/lfalero/q/health')                
                )
          patternMatching:
            patterns:
              - any:
                  - patternRef: pattern-reader
                  - patternRef: pattern-admin

        "route-health":
          when:
            - predicate: "request.method == 'GET'"
            - predicate: "request.path == '/q/health'"
          opa:
            rego: "allow = true"

        "route-health-prefix":
          when:
            - predicate: "request.method == 'GET'"
            - predicate: "request.path == '/lfalero/q/health'"
          opa:
            rego: "allow = true"

        "get-person":
          when:
            - predicate: "request.method == 'GET'"
            - predicate: "request.path == '/person'"
          patternMatching:
            patterns:
              - patternRef: pattern-reader

        "post-person":
          when:
            - predicate: "request.method == 'POST'"
            - predicate: "request.path == '/person'"
          patternMatching:
            patterns:
              - patternRef: pattern-admin

        "put-person":
          when:
            - predicate: "request.method == 'PUT'"
            - predicate: "request.path.matches('^/person/[^/]+$')"
          patternMatching:
            patterns:
              - patternRef: pattern-admin

        "delete-person":
          when:
            - predicate: "request.method == 'DELETE'"
            - predicate: "request.path.matches('^/person/[^/]+$')"
          patternMatching:
            patterns:
              - patternRef: pattern-admin
